# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI + MCP (tsc watch).
# Usage: docker compose -f docker-compose.local.yml -p ai-agent-logs-local up -d --force-recreate
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
      POSTGRES_DB: ai_agent
    ports:
      - "5441:5432"
    volumes:
      - ai-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.26-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      ADDR: ":8120"
      DATABASE_URL: postgres://ai_agent:ai_agent@postgres:5432/ai_agent?sslmode=disable
      JWT_SECRET: change-me-in-production
      MIGRATIONS_DIR: migrations
      GIN_MODE: debug
      GOTOOLCHAIN: auto
      CGO_ENABLED: "0"
    command:
      - sh
      - -c
      - apk add --no-cache git && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - ai-agent-gomod:/go/pkg/mod
      - ai-agent-gotmp:/app/tmp
    ports:
      - "8120:8120"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BASE_PATH: "/ai-agent-logs/"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_API_PROXY: http://api:8120
      VITE_API_BASE_URL: ""
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../ai-agent-logs-webui:/app
      - ai-agent-webui-node-modules:/app/node_modules
    ports:
      - "5176:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

  # Stdio MCP for Cursor on the host; this service keeps deps + dist hot via tsc --watch.
  mcp:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      AI_AGENT_LOGS_API_URL: http://api:8120
    command:
      - sh
      - -c
      - npm install && npx tsc --watch --preserveWatchOutput
    volumes:
      - ../ai-agent-logs-mcp:/app
      - ai-agent-mcp-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  ai-agent-postgres-data:
  ai-agent-gomod:
  ai-agent-gotmp:
  ai-agent-webui-node-modules:
  ai-agent-mcp-node-modules:

networks:
  pc-armin-local:
    external: true
